[project]
name = "tongyun-learn"
version = "0.1.0"
description = "tongyun-learn: FSRS cards + AI explain proxy"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pymysql>=1.1",
  "cryptography>=42",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "tzdata>=2026.5",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

