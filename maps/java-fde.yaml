# 知识地图：Java 后端 / AI 方向 FDE（对齐 /workspace/learning/2026-10-learning-path.md 的 12 周路径）
# 路径「阶段一 补基础（1–4 周）」拆成本图的 s1（集合+并发）和 s2（JVM+MySQL）。
# 字段说明见 design-notes.md 第 1 节和 schema.json。id 一旦导入永不改名、永不复用。
schema_version: 1
map_version: "2026-10-07.1"
subject:
  id: java-fde
  prefix: jf
  title: Java 后端 / AI 方向 FDE
  goal: "12 周内能面 Java 后端 / AI 方向 FDE：八股讲得清、有一个解决具体业务问题的 Java×大模型项目、能和客户沟通。"
  axue_area: 开发编程
  description: "主线 Java 面试，大模型落地做亮点，表达和客户沟通贯穿。销售与商业另算，不在本图。"

stages:
  # ───────────────────────── s1 ─────────────────────────
  - id: jf.s1-core
    order: 1
    title: Java 核心：集合与并发
    weeks: "1-2"
    goal: "集合、并发八股能 2 分钟讲清原理和坑。"
    deliverable: "GitHub 小仓：手写简易 HashMap + 线程池实验 + 一页「我能讲」"
    exit_criteria: "AI 面试官抽 5 题 ≥4 题讲清；本阶段 interview_weight≥2 的点全部 ≥学过"
    points:
      - id: jf.git-secrets
        title: Git 与密钥安全
        description: "Git 快照模型；密钥误提交后先作废换新、再 .gitignore + .env.example，清历史最后做。"
        card_types: [记忆卡, 理解卡, 动手卡]
        prerequisites: []
        effort_hours: 1
        interview_weight: 1
        mastery_evidence: [自测]
        tags: [工程底子, git, 安全]
        sources:
          - {type: lesson, ref: W1D1, title: Git与密钥安全}
        example_cards:
          - type: 理解卡
            front: "带真实 API Key 的 .env 已推到 GitHub，第一步该做什么？为什么不是删提交？"
            back: "第一步去服务商后台作废这把 Key 并换新。推上去后可能已被扫描工具抓走，别人 clone/fork/CI 里也留着历史，删提交拦不住已拿到的人；清理历史是最后一步。"
          - type: 记忆卡
            front: ".gitignore 已有 .env.*，怎么让 .env.example 仍被提交？"
            back: "在后面加一行 !.env.example（! 表示取反，规则顺序有关，要写在 .env.* 之后）；用 git check-ignore -v .env.example 验证，无输出即未被忽略。"

      - id: jf.equals-hashcode
        title: equals / hashCode 与 String
        description: "== 与 equals 区别、equals/hashCode 契约、String 不可变与常量池。"
        card_types: [记忆卡, 理解卡]
        prerequisites: []
        effort_hours: 1
        interview_weight: 3
        mastery_evidence: [自测, 费曼]
        tags: [java基础]
        example_cards:
          - type: 理解卡
            front: "为什么重写 equals 必须同时重写 hashCode？"
            back: "契约要求 equals 相等的对象 hashCode 必须相等。HashMap/HashSet 先按 hashCode 定位桶再用 equals 比较；只重写 equals 时两个「相等」对象可能落进不同桶，导致 get 不到、Set 里出现重复。"
          - type: 记忆卡
            front: "String 为什么设计成不可变？说两点好处。"
            back: "① 线程安全，可放心共享；② hashCode 可缓存，适合做 HashMap 的 key；③ 支持字符串常量池复用；④ 安全（类名、URL、路径等参数传入后不会被篡改）。"

      - id: jf.collections-overview
        title: 集合框架总览与 ArrayList
        description: "List/Set/Map/Queue 体系；ArrayList vs LinkedList；ArrayList 扩容机制；fail-fast。"
        card_types: [记忆卡, 理解卡]
        prerequisites: []
        effort_hours: 1
        interview_weight: 2
        mastery_evidence: [自测]
        tags: [集合]
        example_cards:
          - type: 记忆卡
            front: "ArrayList 默认怎么扩容？"
            back: "无参构造时首次 add 分配容量 10；之后满了按约 1.5 倍扩容（newCapacity = old + (old >> 1)），用 Arrays.copyOf 拷到新数组。能预估大小时用带初始容量的构造器避免多次拷贝。"
          - type: 理解卡
            front: "ArrayList 和 LinkedList 怎么选？"
            back: "ArrayList 基于数组，随机访问 O(1)、尾部追加均摊 O(1)、CPU 缓存友好；LinkedList 是双向链表，随机访问 O(n)，只有在已持有节点位置时插删才 O(1)。实际业务几乎都选 ArrayList。"

      - id: jf.hashmap
        title: HashMap 底层
        description: "JDK 8 数组+链表+红黑树；hash 扰动；容量 2 的幂；负载因子；树化条件；线程不安全的表现。"
        card_types: [记忆卡, 理解卡, 动手卡, 表达卡]
        prerequisites:
          - {id: jf.equals-hashcode, kind: hard}
          - {id: jf.collections-overview, kind: soft}
        effort_hours: 3
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达, 动手]
        tags: [集合, 高频]
        sources:
          - {type: doc, ref: "https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/HashMap.html", title: HashMap Javadoc}
        example_cards:
          - type: 理解卡
            front: "HashMap 容量为什么是 2 的幂？"
            back: "下标用 (n - 1) & hash 计算，n 为 2 的幂时等价于 hash % n 但更快，且低位全为 1 分布更均匀；扩容翻倍时每个元素要么留在原下标，要么移到「原下标 + 旧容量」，只看新增的那一位即可。"
          - type: 记忆卡
            front: "JDK 8 HashMap 链表什么时候转红黑树？"
            back: "某个桶的链表长度达到 8（TREEIFY_THRESHOLD）且数组长度 ≥ 64（MIN_TREEIFY_CAPACITY）时树化；数组不足 64 时先扩容。扩容拆分时某个桶的树节点 ≤ 6（UNTREEIFY_THRESHOLD）会退回链表。"

      - id: jf.thread-basics
        title: 线程基础
        description: "线程 6 种状态；start vs run；sleep vs wait；创建线程的方式；中断。"
        card_types: [记忆卡, 理解卡]
        prerequisites: []
        effort_hours: 1.5
        interview_weight: 2
        mastery_evidence: [自测]
        tags: [并发]
        example_cards:
          - type: 理解卡
            front: "sleep() 和 wait() 有什么区别？"
            back: "sleep 是 Thread 的静态方法，不释放锁，到时自动醒；wait 是 Object 的方法，必须在持有该对象监视器（synchronized 内）时调用，会释放锁，需要 notify/notifyAll 或超时才醒。"
          - type: 记忆卡
            front: "Java 线程有哪 6 种状态（Thread.State）？"
            back: "NEW、RUNNABLE、BLOCKED、WAITING、TIMED_WAITING、TERMINATED。"

      - id: jf.volatile-jmm
        title: JMM 与 volatile
        description: "可见性、有序性、原子性；happens-before；volatile 能做什么不能做什么；DCL 单例。"
        card_types: [理解卡, 表达卡]
        prerequisites:
          - {id: jf.thread-basics, kind: hard}
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达]
        tags: [并发, 高频]
        example_cards:
          - type: 理解卡
            front: "volatile 能保证 count++ 线程安全吗？"
            back: "不能。volatile 保证可见性和禁止指令重排序，但 count++ 是「读-改-写」三步，不是原子操作。要用 AtomicInteger、LongAdder 或加锁。"
          - type: 理解卡
            front: "双重检查锁单例里，instance 为什么要加 volatile？"
            back: "new 对象大致分三步：分配内存、初始化、把引用赋给变量，后两步可能被重排序。不加 volatile，另一个线程可能拿到非 null 但还没初始化完的对象；volatile 禁止这种重排序。"

      - id: jf.locks
        title: synchronized 与 ReentrantLock
        description: "synchronized 原理（monitor）与锁升级；ReentrantLock 特性；怎么选；死锁四条件。"
        card_types: [记忆卡, 理解卡, 表达卡]
        prerequisites:
          - {id: jf.thread-basics, kind: hard}
          - {id: jf.volatile-jmm, kind: soft}
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达]
        tags: [并发, 高频]
        example_cards:
          - type: 理解卡
            front: "ReentrantLock 比 synchronized 多了哪些能力？"
            back: "可中断加锁（lockInterruptibly）、可超时尝试（tryLock）、可选公平锁、可绑定多个 Condition；代价是必须在 finally 里 unlock。没有这些需求时优先 synchronized（JVM 自动释放、写法简单）。"
          - type: 记忆卡
            front: "死锁的四个必要条件？"
            back: "互斥、持有并等待、不可剥夺、循环等待。打破任意一条即可，最常用的是固定加锁顺序（破循环等待）或 tryLock 超时。"

      - id: jf.cas-atomic
        title: CAS 与原子类
        description: "CAS 原理、ABA 问题与 AtomicStampedReference、AtomicInteger 与 LongAdder。"
        card_types: [记忆卡, 理解卡]
        prerequisites:
          - {id: jf.volatile-jmm, kind: hard}
        effort_hours: 1.5
        interview_weight: 2
        mastery_evidence: [自测, 费曼]
        tags: [并发]
        example_cards:
          - type: 理解卡
            front: "什么是 ABA 问题？怎么解决？"
            back: "CAS 只比较值：值从 A 改成 B 又改回 A，CAS 仍会成功，但中间已被改过。解决办法是加版本号，如 AtomicStampedReference（值 + 戳一起比较）。"
          - type: 理解卡
            front: "高并发计数为什么 LongAdder 比 AtomicLong 快？"
            back: "AtomicLong 所有线程 CAS 同一个变量，竞争激烈时大量自旋失败；LongAdder 把计数分散到多个 Cell，各线程更新不同 Cell，sum() 时再汇总。代价是 sum() 不是精确快照。"

      - id: jf.concurrenthashmap
        title: ConcurrentHashMap
        description: "JDK 7 分段锁 vs JDK 8 CAS + synchronized 锁桶头；为什么不允许 null；size 怎么算。"
        card_types: [记忆卡, 理解卡, 表达卡]
        prerequisites:
          - {id: jf.hashmap, kind: hard}
          - {id: jf.cas-atomic, kind: soft}
          - {id: jf.locks, kind: soft}
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达]
        tags: [集合, 并发, 高频]
        example_cards:
          - type: 理解卡
            front: "JDK 8 的 ConcurrentHashMap 怎么保证线程安全？"
            back: "桶为空时用 CAS 放入首节点；桶非空时 synchronized 锁住该桶的头节点再操作链表/红黑树，锁粒度是单个桶。JDK 7 是 Segment 分段锁（Segment 继承 ReentrantLock）。"
          - type: 理解卡
            front: "ConcurrentHashMap 为什么不允许 key/value 为 null？"
            back: "并发下 get 返回 null 有歧义：分不清「没有这个 key」还是「值就是 null」，而又无法像单线程那样用 containsKey 再确认（两次调用之间可能被别的线程改了）。"

      - id: jf.thread-pool
        title: 线程池 ThreadPoolExecutor
        description: "7 个参数、任务提交流程、4 种拒绝策略、为什么不用 Executors 的默认工厂方法、参数怎么定。"
        card_types: [记忆卡, 理解卡, 动手卡, 表达卡]
        prerequisites:
          - {id: jf.thread-basics, kind: hard}
          - {id: jf.locks, kind: soft}
        effort_hours: 3
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达, 动手]
        tags: [并发, 高频]
        example_cards:
          - type: 理解卡
            front: "向 ThreadPoolExecutor 提交任务后的执行流程？"
            back: "线程数 < corePoolSize：新建核心线程执行；否则放入 workQueue；队列满且线程数 < maximumPoolSize：新建非核心线程；再不行就执行拒绝策略。注意是先排队、队列满了才扩到最大线程数。"
          - type: 记忆卡
            front: "为什么阿里规范不让用 Executors.newFixedThreadPool / newCachedThreadPool？"
            back: "newFixedThreadPool 用无界 LinkedBlockingQueue，任务堆积可能 OOM；newCachedThreadPool 最大线程数为 Integer.MAX_VALUE，可能创建过多线程 OOM。应手动 new ThreadPoolExecutor 指定有界队列和拒绝策略。"

  # ───────────────────────── s2 ─────────────────────────
  - id: jf.s2-jvm-mysql
    order: 2
    title: JVM 与 MySQL
    weeks: "3-4"
    goal: "JVM 内存/GC 和 MySQL 索引/事务/锁能讲清，能用 EXPLAIN 调一条慢 SQL。"
    deliverable: "一次 EXPLAIN 调优记录（前后对比）+ 一页「我能讲」"
    exit_criteria: "AI 面试官抽 5 题 ≥4 题讲清；能现场读懂一份 EXPLAIN 输出"
    points:
      - id: jf.jvm-memory
        title: JVM 运行时数据区
        description: "堆、虚拟机栈、本地方法栈、程序计数器、方法区/元空间；哪些线程共享；各自的 OOM/StackOverflow。"
        card_types: [记忆卡, 理解卡]
        prerequisites: []
        effort_hours: 1.5
        interview_weight: 3
        mastery_evidence: [自测, 费曼]
        tags: [jvm, 高频]
        example_cards:
          - type: 记忆卡
            front: "JVM 运行时数据区有哪些？哪些线程私有？"
            back: "线程共享：堆、方法区（JDK 8 起由元空间实现，用本地内存）。线程私有：虚拟机栈、本地方法栈、程序计数器。程序计数器是唯一没有规定 OutOfMemoryError 的区域。"
          - type: 理解卡
            front: "JDK 8 为什么用元空间取代永久代？"
            back: "永久代在堆里、大小固定，类多时容易 java.lang.OutOfMemoryError: PermGen space 且难调；元空间放在本地内存，默认随需增长（可用 -XX:MaxMetaspaceSize 限制），也便于和 JRockit 合并。"

      - id: jf.jvm-gc
        title: 垃圾回收
        description: "可达性分析与 GC Roots；分代模型；标记-清除/复制/标记-整理；常见收集器与默认值。"
        card_types: [记忆卡, 理解卡, 表达卡]
        prerequisites:
          - {id: jf.jvm-memory, kind: hard}
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达]
        tags: [jvm, 高频]
        example_cards:
          - type: 理解卡
            front: "Java 怎么判断对象可以回收？为什么不用引用计数？"
            back: "用可达性分析：从 GC Roots（栈中局部变量引用、静态变量、常量、JNI 引用、活跃线程等）出发，不可达的对象可回收。引用计数解决不了循环引用。"
          - type: 记忆卡
            front: "新生代为什么用复制算法？JDK 9 起默认收集器是什么？"
            back: "新生代对象大多朝生夕死，存活少，复制成本低且无碎片（Eden + 两个 Survivor）。JDK 9 起服务端默认 G1。"

      - id: jf.class-loading
        title: 类加载与双亲委派
        description: "加载、验证、准备、解析、初始化；双亲委派流程与好处；打破双亲委派的例子。"
        card_types: [记忆卡, 理解卡]
        prerequisites:
          - {id: jf.jvm-memory, kind: soft}
        effort_hours: 1
        interview_weight: 2
        mastery_evidence: [自测]
        tags: [jvm]
        example_cards:
          - type: 理解卡
            front: "什么是双亲委派？有什么好处？"
            back: "类加载器收到请求先交给父加载器，父加载不了才自己加载。好处：核心类（如 java.lang.String）只会由启动类加载器加载，防止被篡改，也避免重复加载。Tomcat 为隔离各 Web 应用打破了它。"

      - id: jf.jvm-tuning
        title: JVM 排查与调优思路
        description: "OOM 排查（堆转储 + MAT）、CPU 飙高与死锁排查（top + jstack）、常用参数。"
        card_types: [记忆卡, 理解卡, 动手卡, 表达卡]
        prerequisites:
          - {id: jf.jvm-gc, kind: hard}
        effort_hours: 2
        interview_weight: 2
        mastery_evidence: [自测, 表达]
        tags: [jvm, 排障]
        example_cards:
          - type: 表达卡
            front: "线上服务 CPU 100%，你怎么排查？（1 分钟口述）"
            back: "要点：top 找到进程 → top -Hp <pid> 找最忙线程 → 线程 id 转 16 进制 → jstack <pid> 里搜 nid 看栈 → 定位死循环/频繁 GC（再用 jstat -gcutil 看 GC 情况）。结论先行、给出一次真实或模拟例子、提一个坑（如只看一次 jstack 不够，要连续多次）。"
          - type: 记忆卡
            front: "怎么让 JVM 在 OOM 时自动留下堆转储？"
            back: "加 -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/path；也可手动 jmap -dump:live,format=b,file=heap.hprof <pid>，再用 MAT 等工具分析。"

      - id: jf.mysql-index
        title: MySQL 索引原理
        description: "InnoDB B+ 树；聚簇索引与二级索引；回表、覆盖索引、最左前缀、索引下推。"
        card_types: [记忆卡, 理解卡, 表达卡]
        prerequisites: []
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达]
        tags: [mysql, 高频]
        example_cards:
          - type: 理解卡
            front: "InnoDB 为什么用 B+ 树而不是 B 树或红黑树？"
            back: "B+ 树非叶子节点只存键，一页能放更多键，树更矮（千万级数据通常 3 层左右），磁盘 IO 少；数据都在叶子且叶子用链表相连，范围查询顺序扫即可。红黑树是二叉，高度太高。"
          - type: 理解卡
            front: "什么是回表？怎么避免？"
            back: "二级索引叶子存的是主键值，查到主键后再去聚簇索引取整行就是回表。若查询列都在二级索引里（覆盖索引），EXPLAIN 的 Extra 显示 Using index，就不用回表。"

      - id: jf.mysql-explain
        title: EXPLAIN 与索引失效
        description: "看懂 type/key/rows/Extra；常见索引失效场景；用 EXPLAIN 调慢 SQL。"
        card_types: [记忆卡, 理解卡, 动手卡]
        prerequisites:
          - {id: jf.mysql-index, kind: hard}
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [自测, 动手]
        tags: [mysql, 高频]
        example_cards:
          - type: 记忆卡
            front: "EXPLAIN 的 type 从好到差常见有哪些？"
            back: "system > const > eq_ref > ref > range > index > ALL。至少要到 range，出现 ALL 是全表扫描。"
          - type: 理解卡
            front: "联合索引 (a, b, c)，下面哪条用不上索引：① WHERE a=1 AND c=3 ② WHERE b=2 ③ WHERE a=1 AND b>2 AND c=3？"
            back: "② 用不上（不满足最左前缀）。① 只能用到 a（c 可借助索引下推过滤）。③ 能用 a、b，b 是范围查询，c 不能再用于索引定位。"

      - id: jf.mysql-transaction
        title: 事务、隔离级别与 MVCC
        description: "ACID；四种隔离级别与三种读问题；InnoDB 默认 RR；MVCC（undo log + ReadView）；redo/undo/binlog 分工。"
        card_types: [记忆卡, 理解卡, 表达卡]
        prerequisites:
          - {id: jf.mysql-index, kind: soft}
        effort_hours: 2.5
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达]
        tags: [mysql, 高频]
        example_cards:
          - type: 记忆卡
            front: "四种隔离级别分别解决什么问题？InnoDB 默认哪个？"
            back: "读未提交：都不解决；读已提交：解决脏读；可重复读：再解决不可重复读；串行化：再解决幻读。InnoDB 默认可重复读（REPEATABLE READ），并用 MVCC + next-key lock 在很大程度上避免幻读。"
          - type: 理解卡
            front: "redo log、undo log、binlog 各干什么？"
            back: "redo log（InnoDB）记录物理修改，保证崩溃后已提交事务不丢（持久性）；undo log 记录修改前的版本，用于回滚和 MVCC 读旧版本；binlog（Server 层）记录逻辑变更，用于主从复制和按时间点恢复。"

      - id: jf.mysql-locks
        title: InnoDB 锁
        description: "行锁加在索引上；记录锁、间隙锁、next-key lock；死锁与排查。"
        card_types: [理解卡, 表达卡]
        prerequisites:
          - {id: jf.mysql-transaction, kind: hard}
        effort_hours: 2
        interview_weight: 2
        mastery_evidence: [自测, 费曼]
        tags: [mysql]
        sources:
          - {type: doc, ref: "https://dev.mysql.com/doc/refman/8.0/en/innodb-locking.html", title: InnoDB Locking}
        example_cards:
          - type: 理解卡
            front: "UPDATE 的 WHERE 条件没走索引会怎样？"
            back: "InnoDB 行锁是加在索引记录上的；没走索引会全表扫描，扫描到的每一行都会被加锁（RR 下还有间隙锁），效果接近锁全表，并发更新会大量阻塞。"
          - type: 理解卡
            front: "MySQL 发生死锁时会怎样？怎么查？"
            back: "InnoDB 默认开启死锁检测，发现后回滚其中代价较小的事务，报错 Deadlock found。用 SHOW ENGINE INNODB STATUS 看 LATEST DETECTED DEADLOCK；预防：按固定顺序加锁、缩短事务、走索引。"

      - id: jf.mysql-slow-query
        title: 慢查询与深分页
        description: "开启慢查询日志；深分页 LIMIT 大偏移的问题与优化。"
        card_types: [理解卡, 动手卡]
        prerequisites:
          - {id: jf.mysql-explain, kind: hard}
        effort_hours: 1.5
        interview_weight: 2
        mastery_evidence: [自测, 动手]
        tags: [mysql]
        example_cards:
          - type: 理解卡
            front: "SELECT * FROM t ORDER BY id LIMIT 1000000, 10 为什么慢？怎么优化？"
            back: "要先扫出并丢弃前 100 万行。优化：① 游标式分页 WHERE id > 上一页最大 id LIMIT 10；② 延迟关联：先在覆盖索引上查出 10 个 id，再 JOIN 回表取整行。"

  # ───────────────────────── s3 ─────────────────────────
  - id: jf.s3-spring-mw
    order: 3
    title: Spring + 中间件
    weeks: "5-7"
    goal: "Spring 核心机制和 Redis/MQ 常见问题能讲清；搭出一个 Spring Boot + MySQL + Redis 小服务。"
    deliverable: "可运行的 Spring Boot 服务（含 README、接口文档）"
    exit_criteria: "能讲清服务里每层为什么这么做；缓存三大问题能现场画图答"
    points:
      - id: jf.spring-ioc
        title: Spring IOC 与 Bean 生命周期
        description: "IOC/DI；Bean 生命周期；循环依赖与三级缓存；作用域。"
        card_types: [记忆卡, 理解卡, 表达卡]
        prerequisites: []
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达]
        tags: [spring, 高频]
        example_cards:
          - type: 理解卡
            front: "Spring 怎么解决循环依赖？哪些情况解决不了？"
            back: "单例 Bean 通过三级缓存提前暴露「半成品」引用（三级缓存存 ObjectFactory，必要时生成早期代理）解决字段/setter 注入的循环依赖。构造器注入的循环依赖、prototype 作用域解决不了。Spring Boot 2.6 起默认禁止循环依赖（spring.main.allow-circular-references=false）。"
          - type: 记忆卡
            front: "Bean 生命周期的主干顺序？"
            back: "实例化 → 属性填充（依赖注入）→ Aware 回调 → BeanPostProcessor 前置 → 初始化（@PostConstruct、afterPropertiesSet、init-method）→ BeanPostProcessor 后置（AOP 代理一般在这里生成）→ 使用 → 销毁（@PreDestroy、destroy）。"

      - id: jf.spring-aop
        title: Spring AOP 与代理
        description: "JDK 动态代理 vs CGLIB；Spring Boot 默认代理方式；自调用失效。"
        card_types: [理解卡, 表达卡]
        prerequisites:
          - {id: jf.spring-ioc, kind: hard}
        effort_hours: 1.5
        interview_weight: 3
        mastery_evidence: [自测, 费曼]
        tags: [spring, 高频]
        example_cards:
          - type: 理解卡
            front: "JDK 动态代理和 CGLIB 区别？Spring Boot 默认用哪个？"
            back: "JDK 动态代理基于接口生成代理类；CGLIB 通过生成子类代理，不能代理 final 类/方法。Spring Boot 2.0 起默认 spring.aop.proxy-target-class=true，即默认用 CGLIB。"
          - type: 理解卡
            front: "同一个类里 a() 调用带切面的 b()，切面为什么不生效？"
            back: "this.b() 调的是目标对象本身而不是代理对象，绕过了代理。解决：把 b 拆到另一个 Bean，或注入自身代理/用 AopContext.currentProxy()（需 exposeProxy=true）。"

      - id: jf.spring-transaction
        title: Spring 事务
        description: "@Transactional 原理；传播行为；回滚规则；常见失效场景。"
        card_types: [记忆卡, 理解卡, 表达卡]
        prerequisites:
          - {id: jf.spring-aop, kind: hard}
          - {id: jf.mysql-transaction, kind: soft}
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达]
        tags: [spring, 高频]
        sources:
          - {type: doc, ref: "https://docs.spring.io/spring-framework/reference/data-access/transaction.html", title: Spring Transaction Management}
        example_cards:
          - type: 理解卡
            front: "@Transactional 常见的失效场景说三个。"
            back: "① 同类自调用（不走代理）；② 方法里 catch 住异常没抛出；③ 抛出受检异常——默认只对 RuntimeException 和 Error 回滚，需要 rollbackFor = Exception.class；另外数据库引擎不支持事务（如 MyISAM）也会失效。"
          - type: 记忆卡
            front: "REQUIRED、REQUIRES_NEW、NESTED 有什么区别？"
            back: "REQUIRED（默认）：有事务就加入，没有就新建。REQUIRES_NEW：挂起外层，总是新建独立事务。NESTED：在外层事务里建保存点，内层回滚只回到保存点，外层回滚会连带内层。"

      - id: jf.springboot-autoconfig
        title: Spring Boot 自动配置
        description: "@SpringBootApplication 组成；自动配置类怎么被发现；条件注解；starter。"
        card_types: [记忆卡, 理解卡]
        prerequisites:
          - {id: jf.spring-ioc, kind: hard}
        effort_hours: 1.5
        interview_weight: 2
        mastery_evidence: [自测, 费曼]
        tags: [spring]
        example_cards:
          - type: 理解卡
            front: "Spring Boot 自动配置的原理？"
            back: "@SpringBootApplication 包含 @SpringBootConfiguration、@EnableAutoConfiguration、@ComponentScan。@EnableAutoConfiguration 加载 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports（2.7 起；更早是 spring.factories）里列出的配置类，再由 @ConditionalOnClass、@ConditionalOnMissingBean 等条件决定是否生效。"

      - id: jf.web-auth
        title: Web 鉴权：Cookie、Session、JWT
        description: "Session 与 JWT 的取舍；JWT 结构；Spring Security 过滤器链大意。"
        card_types: [记忆卡, 理解卡]
        prerequisites:
          - {id: jf.spring-ioc, kind: soft}
        effort_hours: 1.5
        interview_weight: 2
        mastery_evidence: [自测]
        tags: [web, 安全]
        sources:
          - {type: lesson, ref: W4D2, title: 鉴权：Cookie、Session 与 JWT}
        example_cards:
          - type: 理解卡
            front: "JWT 相比 Session 的优缺点？"
            back: "优点：服务端无状态，易水平扩展、跨服务。缺点：签发后在过期前难以主动作废（要配黑名单或短有效期 + refresh token）；payload 只是 Base64URL 编码不是加密，不能放敏感信息。"

      - id: jf.redis-basics
        title: Redis 数据结构与持久化
        description: "5 种基础类型及典型场景；为什么快；RDB vs AOF。"
        card_types: [记忆卡, 理解卡]
        prerequisites: []
        effort_hours: 1.5
        interview_weight: 3
        mastery_evidence: [自测, 费曼]
        tags: [redis, 高频]
        sources:
          - {type: doc, ref: "https://redis.io/docs/latest/", title: Redis Docs}
        example_cards:
          - type: 记忆卡
            front: "Redis 5 种基础数据类型和各一个典型场景？"
            back: "String：缓存、计数器、分布式锁；Hash：对象字段；List：简单队列；Set：去重、共同好友；ZSet：排行榜（按分数排序）。"
          - type: 理解卡
            front: "RDB 和 AOF 有什么区别？"
            back: "RDB 定时生成内存快照，文件小、恢复快，但可能丢最后一次快照后的数据；AOF 追加记录写命令，appendfsync everysec 时最多丢约 1 秒，文件大需重写。生产常两者都开（或用 4.0+ 混合持久化）。"

      - id: jf.redis-cache-problems
        title: 缓存穿透/击穿/雪崩与一致性
        description: "三大问题的成因和对策；Cache Aside 与缓存和数据库一致性。"
        card_types: [理解卡, 表达卡]
        prerequisites:
          - {id: jf.redis-basics, kind: hard}
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达]
        tags: [redis, 高频]
        example_cards:
          - type: 理解卡
            front: "缓存穿透、击穿、雪崩分别是什么？各一个对策。"
            back: "穿透：查不存在的数据，每次都打到 DB → 缓存空值或布隆过滤器。击穿：某个热点 key 过期瞬间大量请求打到 DB → 互斥锁重建或逻辑过期。雪崩：大量 key 同时过期或 Redis 宕机 → 过期时间加随机值、Redis 高可用、限流降级。"
          - type: 理解卡
            front: "Cache Aside 更新数据时为什么是「先更新数据库，再删缓存」？"
            back: "先删缓存再更新 DB，期间别的读请求会把旧值重新写回缓存，不一致窗口大；先更新 DB 再删缓存，只有在很窄的时序下才会脏，可再配延迟双删或订阅 binlog 删缓存兜底。删而不是更新缓存，是为了避免并发写导致缓存值乱序。"

      - id: jf.redis-distributed-lock
        title: Redis 分布式锁
        description: "SET NX PX；安全释放；锁续期（Redisson 看门狗）。"
        card_types: [理解卡, 表达卡]
        prerequisites:
          - {id: jf.redis-basics, kind: hard}
          - {id: jf.locks, kind: soft}
        effort_hours: 1.5
        interview_weight: 2
        mastery_evidence: [自测, 费曼]
        tags: [redis, 分布式]
        example_cards:
          - type: 理解卡
            front: "用 Redis 实现分布式锁，加锁和释放各要注意什么？"
            back: "加锁：SET lock_key <唯一值> NX PX 30000，一条命令同时保证互斥和过期，防止进程挂掉后死锁。释放：用 Lua 脚本先比较值是自己的再 DEL，避免误删别人的锁。业务可能超时就要续期，如 Redisson 看门狗（默认 30 秒锁时长，定期续期）。"

      - id: jf.mq-basics
        title: 消息队列基础
        description: "MQ 三大作用；消息丢失、重复消费、顺序消费的处理。"
        card_types: [记忆卡, 理解卡, 表达卡]
        prerequisites: []
        effort_hours: 2
        interview_weight: 2
        mastery_evidence: [自测, 费曼]
        tags: [mq]
        example_cards:
          - type: 理解卡
            front: "怎么保证消息不丢？"
            back: "三段都要管：生产者用发送确认（如 Kafka acks=all、RabbitMQ publisher confirm）并失败重试；Broker 持久化/多副本；消费者处理成功后再手动 ack/提交 offset。"
          - type: 理解卡
            front: "消息重复消费怎么办？"
            back: "MQ 一般只保证至少一次投递，重复无法完全避免，要让消费逻辑幂等：业务唯一键 + 数据库唯一索引、消费记录表、状态机只允许单向流转等。"

      - id: jf.springboot-service
        title: 动手：Spring Boot + MySQL + Redis 小服务
        description: "分层（Controller/Service/Mapper）、MyBatis、Redis 缓存、统一异常、接口文档；能讲清每层为什么。"
        card_types: [动手卡, 表达卡]
        prerequisites:
          - {id: jf.springboot-autoconfig, kind: hard}
          - {id: jf.redis-cache-problems, kind: soft}
          - {id: jf.spring-transaction, kind: soft}
        effort_hours: 8
        interview_weight: 2
        mastery_evidence: [动手, 表达]
        tags: [项目, spring]
        example_cards:
          - type: 动手卡
            front: "给商品详情接口加 Redis 缓存：查询走 Cache Aside，更新时删缓存，并对不存在的商品缓存空值 60 秒。交付代码 + 一段压测前后对比。"
            back: "验收：① 第二次查询命中缓存（日志或 Redis MONITOR 可见）；② 更新后再查是新值；③ 查不存在 id 时 60 秒内不再打 DB；④ 能说出过期时间为什么加随机值。"
          - type: 表达卡
            front: "1 分钟讲清你这个服务为什么分成 Controller/Service/Mapper 三层。"
            back: "要点：结论（职责分离便于测试和替换）→ 每层只做什么（参数校验与协议 / 业务与事务边界 / 数据访问）→ 举例（事务注解放在 Service 层的原因）→ 坑（Controller 里写业务导致事务和复用出问题）。"

  # ───────────────────────── s4 ─────────────────────────
  - id: jf.s4-ai-project
    order: 4
    title: AI 业务项目（Java × 大模型）
    weeks: "8-10"
    goal: "在上一阶段服务上用 Spring AI（或 LangChain4j）做出一个解决具体业务问题的系统，并能讲给业务方听。"
    deliverable: "需求文档 + 可演示系统（含前端页）+ 架构图 + 效果数据"
    exit_criteria: "能 3 分钟讲项目（痛点、方案、架构、效果、取舍）；客户沟通演练中非技术方能听懂方案"
    points:
      - id: jf.llm-basics
        title: 大模型基础概念
        description: "token、上下文窗口、temperature、幻觉、按输入/输出 token 计费、模型选型。"
        card_types: [记忆卡, 理解卡]
        prerequisites: []
        effort_hours: 1
        interview_weight: 2
        mastery_evidence: [自测]
        tags: [ai]
        sources:
          - {type: lesson, ref: W1D3, title: 大模型 API}
        example_cards:
          - type: 理解卡
            front: "temperature 调高、调低分别有什么效果？业务里怎么选？"
            back: "调高输出更随机多样，调低更稳定确定。分类、抽取、结构化输出这类要稳定结果的任务用低温（如 0–0.3）；创意文案可以高一些。"
          - type: 理解卡
            front: "大模型为什么会「幻觉」？工程上怎么减轻？"
            back: "模型按概率生成看起来合理的下一个 token，并不核对事实。减轻：RAG 给出处并要求只依据资料回答、要求引用来源、低温、结构化输出加校验、关键结果人工复核或规则兜底。"

      - id: jf.llm-api-java
        title: 用 Java 调模型 API
        description: "Chat Completions 消息格式（system/user/assistant）、流式输出（SSE）；Spring AI ChatClient 或 LangChain4j；密钥只放服务端。"
        card_types: [记忆卡, 动手卡]
        prerequisites:
          - {id: jf.llm-basics, kind: hard}
          - {id: jf.springboot-autoconfig, kind: soft}
        effort_hours: 3
        interview_weight: 2
        mastery_evidence: [自测, 动手]
        tags: [ai, spring-ai]
        sources:
          - {type: lesson, ref: W1D5, title: 用 curl 调大模型 API 综合练习}
          - {type: doc, ref: "https://docs.spring.io/spring-ai/reference/", title: Spring AI Reference}
          - {type: doc, ref: "https://docs.langchain4j.dev/", title: LangChain4j Docs}
        example_cards:
          - type: 记忆卡
            front: "Chat Completions 请求里 messages 常见的三种 role 各放什么？"
            back: "system：设定角色、规则和输出格式；user：用户输入；assistant：模型之前的回复（多轮对话时带上历史）。用工具调用时还会有 tool 角色返回工具结果。"
          - type: 动手卡
            front: "在 Spring Boot 里用 Spring AI ChatClient 写一个 /chat 接口，支持流式返回；API Key 从环境变量读。"
            back: "验收：curl 能看到逐段返回（SSE 或 Flux<String>）；代码和仓库里没有明文 Key；超时/异常有统一处理。"

      - id: jf.structured-output
        title: 结构化输出
        description: "让模型按 JSON Schema 输出、反序列化成 Java 对象、校验与重试。"
        card_types: [理解卡, 动手卡]
        prerequisites:
          - {id: jf.llm-api-java, kind: hard}
        effort_hours: 2
        interview_weight: 2
        mastery_evidence: [自测, 动手]
        tags: [ai, spring-ai]
        sources:
          - {type: lesson, ref: W2D3, title: 结构化输出}
        example_cards:
          - type: 理解卡
            front: "做工单自动分类时，为什么要用结构化输出而不是让模型自由回答？"
            back: "下游代码要按字段处理（类别、优先级、理由），自由文本难解析也不稳定。用 JSON Schema / 结构化输出约束格式，在 Spring AI 里可直接 .call().entity(TicketResult.class) 映射成对象；仍要做字段校验（如类别必须在枚举内），失败就重试或走人工。"

      - id: jf.function-calling
        title: Function calling（工具调用）
        description: "工具调用循环；工具描述怎么写；Spring AI @Tool；权限和参数校验。"
        card_types: [理解卡, 动手卡, 表达卡]
        prerequisites:
          - {id: jf.llm-api-java, kind: hard}
          - {id: jf.structured-output, kind: soft}
        effort_hours: 3
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 动手]
        tags: [ai, spring-ai, 高频]
        sources:
          - {type: lesson, ref: W3D3, title: function calling 工具调用循环}
        example_cards:
          - type: 理解卡
            front: "function calling 时，工具是模型执行的吗？完整流程是什么？"
            back: "不是。模型只返回「要调哪个工具、参数是什么」；应用代码执行工具，把结果作为 tool 消息再发给模型；模型据此继续调用工具或给出最终回答。所以权限、参数校验、超时都要应用自己做。"
          - type: 表达卡
            front: "面试官问：你项目里 function calling 怎么防止模型乱调接口？（1 分钟）"
            back: "要点：结论（工具白名单 + 服务端校验，模型没有直接权限）→ 原理（工具由应用执行）→ 例子（查订单工具只允许查当前用户的订单，参数在服务端再校验）→ 坑（写操作要二次确认/幂等，限制最大调用轮数防死循环）。"

      - id: jf.rag
        title: RAG 检索增强生成
        description: "Embedding、切块、向量库、top-k 检索、重排序、带出处回答；Spring AI VectorStore；效果评估。"
        card_types: [记忆卡, 理解卡, 动手卡, 表达卡]
        prerequisites:
          - {id: jf.llm-api-java, kind: hard}
          - {id: jf.mysql-index, kind: soft}
        effort_hours: 5
        interview_weight: 3
        mastery_evidence: [自测, 费曼, 表达, 动手]
        tags: [ai, rag, 高频]
        sources:
          - {type: lesson, ref: W4D5, title: Embedding 与 RAG 入门}
        example_cards:
          - type: 理解卡
            front: "RAG 的基本流程？"
            back: "离线：文档切块 → 每块算 embedding → 存入向量库。在线：问题算 embedding → 向量检索 top-k 相关块（可再重排序）→ 把块和问题一起放进 prompt → 模型基于资料回答并给出处。"
          - type: 理解卡
            front: "客户说「文档问答答非所问」，你先查什么？"
            back: "先分清是检索问题还是生成问题：看检索出的 top-k 块里有没有正确答案。没有 → 调切块大小/重叠、换 embedding 模型、加关键词混合检索或重排序；有但答错 → 改 prompt（只依据资料、无答案就说不知道）、减少无关块。用一组标注好的问题做评测集来对比改动。"

      - id: jf.agent
        title: Agent
        description: "Agent 循环（思考-调工具-观察）、终止条件、记忆、何时不该用 Agent。"
        card_types: [理解卡, 动手卡, 表达卡]
        prerequisites:
          - {id: jf.function-calling, kind: hard}
        effort_hours: 3
        interview_weight: 2
        mastery_evidence: [自测, 费曼]
        tags: [ai, agent]
        sources:
          - {type: lesson, ref: W3D5, title: 写一个最小 Agent}
        example_cards:
          - type: 理解卡
            front: "Agent 和一次普通的 function calling 区别在哪？要设什么防护？"
            back: "Agent 是循环：模型反复决定下一步、调工具、看结果，直到完成任务；普通调用通常一两轮固定流程。防护：最大步数/超时/预算上限、工具白名单、写操作人工确认、完整日志便于复盘。流程固定的业务优先用确定的工作流，不必上 Agent。"

      - id: jf.mcp
        title: MCP（Model Context Protocol）
        description: "MCP 解决什么问题；client/server 角色；tools/resources/prompts；传输方式。"
        card_types: [记忆卡, 理解卡]
        prerequisites:
          - {id: jf.function-calling, kind: hard}
        effort_hours: 1.5
        interview_weight: 2
        mastery_evidence: [自测, 费曼]
        tags: [ai, mcp]
        sources:
          - {type: lesson, ref: W4D3, title: MCP是什么}
          - {type: doc, ref: "https://modelcontextprotocol.io/", title: Model Context Protocol}
        example_cards:
          - type: 理解卡
            front: "MCP 是什么？和 function calling 什么关系？"
            back: "MCP 是让 AI 应用以统一方式接入外部工具和数据的开放协议（基于 JSON-RPC 2.0）。MCP Server 暴露 tools、resources、prompts，应用里的 MCP Client 发现并调用它们；模型那一侧调工具仍是 function calling，MCP 统一的是「工具怎么接入」，一个 Server 可被多个应用复用。"
          - type: 记忆卡
            front: "MCP 的两种标准传输方式？"
            back: "stdio（本地子进程，通过标准输入输出通信）和 Streamable HTTP（远程服务）。"

      - id: jf.frontend-enough
        title: 前端够用即止（React 或 Vue 二选一）
        description: "组件、状态、调后端接口、展示流式输出；能做演示页就停。"
        card_types: [理解卡, 动手卡]
        prerequisites:
          - {id: jf.llm-api-java, kind: soft}
        effort_hours: 4
        interview_weight: 1
        mastery_evidence: [动手]
        tags: [前端]
        sources:
          - {type: lesson, ref: W2D2, title: 组件状态props与副作用}
        example_cards:
          - type: 动手卡
            front: "用 React 或 Vue 做一个演示页：输入问题 → 调后端 /chat → 逐段显示回答，并显示出处列表。"
            back: "验收：能流式显示；请求失败有提示；没有把 API Key 放进前端代码（前端只调自己的后端）。"
          - type: 理解卡
            front: "前端页面能不能直接拿 API Key 调大模型？为什么？"
            back: "不能。前端代码和网络请求都在用户浏览器里，Key 一定会被看到并被盗用。应由自己的后端持有 Key，前端只调后端接口，后端负责鉴权、限流和计费控制。"

      - id: jf.biz-requirements
        title: 业务需求与验收标准
        description: "把一个具体业务问题写成一页需求：用户、痛点、现状流程、目标指标、验收标准、不做什么。"
        card_types: [理解卡, 动手卡]
        prerequisites: []
        effort_hours: 2
        interview_weight: 2
        mastery_evidence: [动手]
        tags: [fde, 项目]
        example_cards:
          - type: 动手卡
            front: "为「客服工单自动分类 + 回复建议」写一页需求：用户是谁、现在怎么做、痛点数据、目标指标、验收标准、本期不做什么。"
            back: "验收：指标可量化（如分类准确率 ≥90%、平均处理时长下降 30%）；有验收用的样本集来源；明确「不做」范围（如不自动发送回复，必须人工确认）。"
          - type: 理解卡
            front: "AI 项目的验收标准为什么不能写成「回答准确」？"
            back: "不可测。要写成可量化、可复现的：用多少条标注样本、什么指标（准确率、召回率、人工采纳率、处理时长）、达到多少算过，以及失败时的兜底方式。"

      - id: jf.customer-communication
        title: 客户沟通（FDE）
        description: "需求访谈（开放问题→追问→复述确认）、把技术方案讲给非技术的人、演示与收集反馈、管理预期。"
        card_types: [理解卡, 表达卡]
        prerequisites:
          - {id: jf.biz-requirements, kind: soft}
        effort_hours: 3
        interview_weight: 3
        mastery_evidence: [表达]
        tags: [fde, 表达]
        example_cards:
          - type: 表达卡
            front: "演练：业务方（客服主管）说「我们想用 AI 自动回复客户」。你用 3 个问题开场做需求访谈。"
            back: "参考：① 现在一天多少工单、哪几类最多、平均处理多久？② 哪些回复可以模板化，哪些必须人工判断（如退款、投诉）？③ 怎样算成功——省多少人力，还是缩短响应时间？最后复述确认：「我理解您最想先解决的是……对吗？」"
          - type: 表达卡
            front: "用不出现任何技术术语的话，向业务方解释 RAG 方案（30 秒）。"
            back: "参考：「系统回答前，会先去你们的制度文档里找最相关的几段，再根据这几段来回答，并标出出自哪份文档哪一节。文档里没有的，它会直接说不知道，而不是编。」"

  # ───────────────────────── s5 ─────────────────────────
  - id: jf.s5-interview
    order: 5
    title: 面试冲刺：系统设计与 FDE 场景
    weeks: "11-12"
    goal: "系统设计和 FDE 场景题能按框架答；项目讲稿和简历定稿；两次完整模拟面试顺下来。"
    deliverable: "简历定稿 + 项目讲稿 + 高频题错题本"
    exit_criteria: "Java 后端与 FDE 模拟面试各一次完整顺下来；未解决卡点清零"
    points:
      - id: jf.sysdesign-method
        title: 系统设计答题框架
        description: "澄清需求 → 估算规模 → 接口与数据模型 → 高层架构 → 深挖瓶颈 → 讲取舍。"
        card_types: [理解卡, 表达卡]
        prerequisites:
          - {id: jf.redis-cache-problems, kind: soft}
          - {id: jf.mq-basics, kind: soft}
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [表达]
        tags: [系统设计]
        example_cards:
          - type: 理解卡
            front: "系统设计题一上来为什么不能直接画架构？"
            back: "需求和规模不清，方案无从取舍。先问清功能边界、用户量/QPS、读写比例、一致性和延迟要求，再估算存储和带宽，最后才画架构；面试官更看重这个澄清过程。"

      - id: jf.rate-limit-idempotency
        title: 限流、幂等、降级熔断
        description: "固定窗口/滑动窗口/漏桶/令牌桶；接口幂等的几种做法；降级与熔断区别。"
        card_types: [记忆卡, 理解卡, 表达卡]
        prerequisites:
          - {id: jf.redis-basics, kind: soft}
          - {id: jf.mq-basics, kind: soft}
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [自测, 费曼]
        tags: [系统设计, 高频]
        example_cards:
          - type: 理解卡
            front: "令牌桶和漏桶的区别？"
            back: "令牌桶按固定速率放令牌，请求拿到令牌才处理，桶里攒的令牌允许一定突发流量；漏桶以固定速率流出请求，把输出整形成匀速，不允许突发。Guava RateLimiter 是令牌桶思路。"
          - type: 理解卡
            front: "支付回调可能重复到达，怎么保证幂等？"
            back: "用业务唯一键（如支付流水号）做数据库唯一索引或去重表，插入冲突就直接返回成功；订单状态用状态机只允许「待支付→已支付」单向更新（UPDATE ... WHERE status='待支付'），影响行数为 0 说明已处理过。"

      - id: jf.sysdesign-classic
        title: 经典系统设计题：秒杀
        description: "秒杀/抢券：流量削峰、Redis 预扣库存、MQ 异步下单、防超卖、防刷。"
        card_types: [表达卡, 动手卡]
        prerequisites:
          - {id: jf.sysdesign-method, kind: hard}
          - {id: jf.redis-distributed-lock, kind: soft}
          - {id: jf.rate-limit-idempotency, kind: soft}
        effort_hours: 3
        interview_weight: 3
        mastery_evidence: [表达]
        tags: [系统设计, 高频]
        example_cards:
          - type: 表达卡
            front: "设计一个秒杀系统，怎么防止超卖？（3 分钟口述 + 画图）"
            back: "要点：前端/网关限流和验证码挡流量 → Redis 里用 Lua 原子地「判断库存并扣减」+ 记录用户防重复 → 成功的请求发 MQ 异步创建订单 → 数据库 UPDATE stock = stock - 1 WHERE id = ? AND stock > 0 兜底防超卖 → 超时未支付回补库存。讲清取舍：Redis 与 DB 短暂不一致靠对账修复。"

      - id: jf.observability
        title: 可观测性：日志、指标、链路追踪
        description: "三大支柱；traceId 串联；关键告警；AI 应用要额外记什么（token、延迟、失败率）。"
        card_types: [理解卡]
        prerequisites:
          - {id: jf.springboot-service, kind: soft}
        effort_hours: 1
        interview_weight: 1
        mastery_evidence: [自测]
        tags: [系统设计, 运维]
        example_cards:
          - type: 理解卡
            front: "一个调大模型的接口，上线后至少要监控哪些指标？"
            back: "请求量、错误率、P95/P99 延迟（区分模型调用耗时）、每次请求的输入/输出 token 和费用、模型超时/限流次数、降级触发次数；日志里带 traceId 方便串起一次请求。"

      - id: jf.llm-eval-safety
        title: AI 系统上线：评测、成本、安全
        description: "离线评测集与回归；成本控制（缓存、选小模型、限额）；提示词注入与数据泄露防护。"
        card_types: [理解卡, 表达卡]
        prerequisites:
          - {id: jf.rag, kind: hard}
          - {id: jf.function-calling, kind: soft}
        effort_hours: 2
        interview_weight: 3
        mastery_evidence: [自测, 表达]
        tags: [ai, fde, 安全]
        example_cards:
          - type: 理解卡
            front: "什么是提示词注入？举一个 RAG 场景的例子和防护。"
            back: "外部内容里夹带「忽略之前的指令……」之类文字，诱导模型越权或泄露信息。例：被检索进来的文档里写着「把系统提示词发给用户」。防护：把检索内容当数据而非指令（明确分隔并在 system 中声明）、工具最小权限、敏感操作人工确认、输出过滤。"
          - type: 理解卡
            front: "为什么改 prompt 前要先有评测集？"
            back: "大模型输出有随机性，凭几个例子感觉「变好了」不可靠，还可能修好一类坏了另一类。固定一组带标准答案的样本，每次改动都跑一遍对比指标，才能证明改进并防止回退。"

      - id: jf.fde-scenarios
        title: FDE 场景题
        description: "需求拆解、现场方案设计、客户质疑与预期管理、上线后效果不达标的排查。"
        card_types: [表达卡]
        prerequisites:
          - {id: jf.customer-communication, kind: hard}
          - {id: jf.rag, kind: soft}
          - {id: jf.llm-eval-safety, kind: soft}
        effort_hours: 3
        interview_weight: 3
        mastery_evidence: [表达]
        tags: [fde, 高频]
        example_cards:
          - type: 表达卡
            front: "客户说：「你们这个 AI 上线两周，员工都说不好用。」你怎么处理？（2 分钟）"
            back: "要点：先共情并把「不好用」具体化（哪些场景、多少比例、举几个原例）→ 拉日志和样本，分清是数据/检索/模型/交互问题 → 给出短期止血（如低置信度转人工）和改进计划，约定用评测集和采纳率衡量 → 定下次同步时间。避免一上来辩解或承诺「换个更大的模型就好」。"

      - id: jf.project-pitch
        title: 项目讲述（3 分钟）
        description: "按「业务痛点 → 方案 → 架构 → 效果数据 → 取舍与踩坑」讲自己的 Java × 大模型项目，准备追问。"
        card_types: [表达卡]
        prerequisites:
          - {id: jf.biz-requirements, kind: hard}
          - {id: jf.rag, kind: soft}
          - {id: jf.springboot-service, kind: soft}
        effort_hours: 3
        interview_weight: 3
        mastery_evidence: [表达]
        tags: [项目, 表达, 高频]
        example_cards:
          - type: 表达卡
            front: "用 3 分钟介绍你的 AI 业务项目。"
            back: "评分：第一句说清解决了谁的什么问题；有架构图并讲清为什么选 RAG/工具调用；至少一个量化效果（准确率、节省时长）；讲出一个取舍和一个踩过的坑；能接住「为什么不用 X」的追问。"

      - id: jf.mock-interview
        title: 模拟面试与简历
        description: "简历按 STAR 写项目；Java 后端、FDE 各一场完整模拟面试；录音自评，错题进错题本。"
        card_types: [表达卡, 动手卡]
        prerequisites:
          - {id: jf.project-pitch, kind: hard}
          - {id: jf.sysdesign-method, kind: soft}
        effort_hours: 4
        interview_weight: 3
        mastery_evidence: [表达, 动手]
        tags: [面试]
        example_cards:
          - type: 动手卡
            front: "把简历里的项目经历改成 STAR 结构：每条以动词开头，至少一个量化结果。"
            back: "验收：情境/任务一句话；行动写你本人做的技术决策而不是团队做了什么；结果有数字；没有空泛形容词（如「精通」「大幅提升」不带数据）。"
          - type: 表达卡
            front: "「你最大的缺点是什么？」（1 分钟）"
            back: "要点：说一个真实但不致命的缺点 → 具体例子 → 正在怎么改（有行动和进展）。例：过去偏依赖 AI 写代码、基础不扎实，现在每天系统补基础并用自测和复述检验，已能讲清集合与并发。"
