name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Python jobs run in legacy/ — the previous tongyun-learn service.
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

  mysql-migrate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tongyun_learn
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations on MySQL
        env:
          LEARN_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/tongyun_learn?charset=utf8mb4
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check   # models and migrations must not drift

      - name: Verify table count
        env:
          LEARN_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/tongyun_learn?charset=utf8mb4
        run: |
          uv run python -c '
          import os
          from sqlalchemy import create_engine, inspect
          url = os.environ["LEARN_DATABASE_URL"]
          engine = create_engine(url)
          tables = inspect(engine).get_table_names()
          print("MySQL tables:", sorted(tables))
          assert len(tables) == 22, f"Expected 22 tables, got {len(tables)}: {tables}"
          '

      - name: Run tests against MySQL
        env:
          LEARN_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/tongyun_learn?charset=utf8mb4
        run: |
          LEARN_TEST_DATABASE_URL=$LEARN_DATABASE_URL uv run pytest -q

  # Words SQL stays in this job. mysql-migrate asserts the legacy schema is exactly 22 tables.
  node:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tongyun_learn
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply words sync migration up, down, up
        env:
          WORDS_DATABASE_URL: mysql://root:root@127.0.0.1:3306/tongyun_learn
        run: |
          node scripts/apply-words-sql.mjs server/db/migrations/001_words_sync.sql
          node scripts/apply-words-sql.mjs server/db/migrations/001_words_sync.down.sql
          node scripts/apply-words-sql.mjs --expect-absent words_attempts words_card_state
          node scripts/apply-words-sql.mjs server/db/migrations/001_words_sync.sql

      - name: Run vitest
        env:
          WORDS_DATABASE_URL: mysql://root:root@127.0.0.1:3306/tongyun_learn
        run: pnpm test

      - name: Build
        run: pnpm build
