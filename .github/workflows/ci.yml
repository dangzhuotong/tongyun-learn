name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest -q

  mysql-migrate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tongyun_learn
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations on MySQL
        env:
          LEARN_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/tongyun_learn?charset=utf8mb4
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check   # models and migrations must not drift

      - name: Verify table count
        env:
          LEARN_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/tongyun_learn?charset=utf8mb4
        run: |
          uv run python -c '
          import os
          from sqlalchemy import create_engine, inspect
          url = os.environ["LEARN_DATABASE_URL"]
          engine = create_engine(url)
          tables = inspect(engine).get_table_names()
          print("MySQL tables:", sorted(tables))
          assert len(tables) == 22, f"Expected 22 tables, got {len(tables)}: {tables}"
          '

      - name: Run tests against MySQL
        env:
          LEARN_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/tongyun_learn?charset=utf8mb4
        run: |
          LEARN_TEST_DATABASE_URL=$LEARN_DATABASE_URL uv run pytest -q
